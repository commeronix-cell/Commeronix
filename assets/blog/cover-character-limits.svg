<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bg-radial-cl" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="cobalt-grad-cl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="lime-grad-cl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4D"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>
    <linearGradient id="card-grad-cl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <pattern id="grid-cl" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-radial-cl)"/>
  <rect width="1200" height="675" fill="url(#grid-cl)"/>
  <rect x="24" y="24" width="1152" height="627" rx="16" stroke="#2563EB" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 56)">
    <rect width="210" height="34" rx="17" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="17" cy="17" r="5" fill="#C6FF00"/>
    <text x="32" y="22" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CONTENT STRATEGY</text>

    <text x="0" y="80" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Social Media Character Limits
    </text>
    <text x="560" y="80" fill="#C6FF00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      (2026 Standards)
    </text>
    <text x="0" y="112" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Exact Truncation Folds • "See More" Cutoffs • Instagram, X, LinkedIn, TikTok &amp; YouTube
    </text>
  </g>

  <!-- Platform Cards -->
  <g transform="translate(60, 205)">
    <!-- X/Twitter -->
    <g transform="translate(0, 0)">
      <rect width="255" height="360" rx="14" fill="url(#card-grad-cl)" stroke="#334155" stroke-width="1.5"/>
      <rect x="2" y="2" width="251" height="4" rx="2" fill="url(#cobalt-grad-cl)"/>
      <text x="24" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">X (Twitter)</text>
      <text x="24" y="70" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Free Tier Limit</text>
      <text x="24" y="140" fill="#C6FF00" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800">280</text>
      <text x="24" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Characters Max</text>
      <line x1="24" y1="200" x2="230" y2="200" stroke="#334155" stroke-width="1"/>
      <text x="24" y="235" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Truncation Rule:</text>
      <text x="24" y="260" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">URLs consume 23 chars.</text>
      <text x="24" y="282" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Emojis count as 2 chars.</text>
      <rect x="24" y="305" width="207" height="32" rx="6" fill="#1E293B"/>
      <text x="127" y="326" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Feed Sweet Spot: 70–120 Chars</text>
    </g>

    <!-- Instagram -->
    <g transform="translate(285, 0)">
      <rect width="255" height="360" rx="14" fill="url(#card-grad-cl)" stroke="#2563EB" stroke-width="2"/>
      <rect x="2" y="2" width="251" height="4" rx="2" fill="url(#lime-grad-cl)"/>
      <text x="24" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">Instagram</text>
      <text x="24" y="70" fill="#C6FF00" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Caption Hard Cap</text>
      <text x="24" y="140" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800">2,200</text>
      <text x="24" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Characters Max (30 Hashtags)</text>
      <line x1="24" y1="200" x2="230" y2="200" stroke="#334155" stroke-width="1"/>
      <text x="24" y="235" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Visible Before Fold:</text>
      <text x="24" y="260" fill="#C6FF00" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">First 125 Characters</text>
      <text x="24" y="282" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Hooks must precede fold.</text>
      <rect x="24" y="305" width="207" height="32" rx="6" fill="#14532D"/>
      <text x="127" y="326" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Mobile Fold: 125 Chars</text>
    </g>

    <!-- LinkedIn -->
    <g transform="translate(570, 0)">
      <rect width="255" height="360" rx="14" fill="url(#card-grad-cl)" stroke="#334155" stroke-width="1.5"/>
      <rect x="2" y="2" width="251" height="4" rx="2" fill="url(#cobalt-grad-cl)"/>
      <text x="24" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">LinkedIn</text>
      <text x="24" y="70" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Post Limit</text>
      <text x="24" y="140" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800">3,000</text>
      <text x="24" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Characters Max</text>
      <line x1="24" y1="200" x2="230" y2="200" stroke="#334155" stroke-width="1"/>
      <text x="24" y="235" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">"See More" Cutoff:</text>
      <text x="24" y="260" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">140–210 Characters</text>
      <text x="24" y="282" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Varies by mobile viewport.</text>
      <rect x="24" y="305" width="207" height="32" rx="6" fill="#1E293B"/>
      <text x="127" y="326" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Headline Hook: 3 Lines</text>
    </g>

    <!-- TikTok & YouTube -->
    <g transform="translate(855, 0)">
      <rect width="225" height="360" rx="14" fill="url(#card-grad-cl)" stroke="#334155" stroke-width="1.5"/>
      <rect x="2" y="2" width="221" height="4" rx="2" fill="url(#cobalt-grad-cl)"/>
      <text x="20" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">TikTok / YouTube</text>
      <text x="20" y="70" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Expanded Video SEO</text>
      <text x="20" y="140" fill="#C6FF00" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800">4,000</text>
      <text x="20" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">TikTok (YouTube: 5,000)</text>
      <line x1="20" y1="200" x2="205" y2="200" stroke="#334155" stroke-width="1"/>
      <text x="20" y="235" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">On-Screen Overlay:</text>
      <text x="20" y="260" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Top 150 Chars on UI</text>
      <text x="20" y="282" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Avoids right-side icons.</text>
      <rect x="20" y="305" width="185" height="32" rx="6" fill="#1E293B"/>
      <text x="112" y="326" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SEO Keywords in Top 100</text>
    </g>
  </g>

  <!-- Bottom Global Trust Ribbon -->
  <g transform="translate(60, 608)">
    <circle cx="6" cy="6" r="4" fill="#C6FF00"/>
    <text x="20" y="10" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      Live text calibration with Commeronix Word &amp; Character Counter • commeronix.com/word-counter
    </text>
  </g>
</svg>

