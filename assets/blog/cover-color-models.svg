<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad3)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Badge -->
  <rect x="80" y="70" width="180" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1">COLOR ARCHITECTURE</text>

  <!-- Color Wheel / Spectrum Circle Visual (Center) -->
  <g transform="translate(600, 340)">
    <!-- Outer HSL Ring -->
    <circle cx="0" cy="0" r="160" stroke="#2563EB" stroke-width="18" stroke-dasharray="20 10" opacity="0.6"/>
    <circle cx="0" cy="0" r="130" stroke="#C6FF00" stroke-width="12" stroke-dasharray="15 8" filter="url(#glow3)"/>
    
    <!-- Central Swatch -->
    <circle cx="0" cy="0" r="75" fill="#2563EB" stroke="#FFFFFF" stroke-width="4" filter="url(#glow3)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="700">#2563EB</text>
    <text x="0" y="16" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="13">COBALT</text>
  </g>

  <!-- Left Card: HEX Model -->
  <rect x="120" y="200" width="260" height="280" rx="16" fill="#161B22" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="145" y="225" width="50" height="50" rx="10" fill="#2563EB"/>
  <text x="210" y="255" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">HEX</text>
  <text x="145" y="315" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="14">BASE-16 RADIX</text>
  <text x="145" y="345" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">6-character hexadecimal mapping for web markup and CSS color strings.</text>
  <rect x="145" y="415" width="210" height="36" rx="8" fill="#0B0C10" stroke="#2563EB" stroke-width="1"/>
  <text x="250" y="438" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="13">#0B0C10 / #C6FF00</text>

  <!-- Right Card: HSL Model -->
  <rect x="820" y="200" width="260" height="280" rx="16" fill="#161B22" stroke="#C6FF00" stroke-width="2" filter="url(#glow3)"/>
  <rect x="845" y="225" width="50" height="50" rx="10" fill="#C6FF00"/>
  <text x="910" y="255" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">HSL</text>
  <text x="845" y="315" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14">CYLINDRICAL MODEL</text>
  <text x="845" y="345" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Hue (0-360°), Saturation %, Lightness % for fluid dynamic design systems.</text>
  <rect x="845" y="415" width="210" height="36" rx="8" fill="#0B0C10" stroke="#C6FF00" stroke-width="1"/>
  <text x="950" y="438" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="13">hsl(74, 100%, 50%)</text>

  <!-- Bottom WCAG Contrast Badge -->
  <rect x="360" y="550" width="480" height="50" rx="10" fill="#161B22" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="580" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">WCAG 2.1 AA ACCESSIBILITY: 8.4:1 CONTRAST RATIO</text>
</svg>
