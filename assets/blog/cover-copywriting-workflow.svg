<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-radial-w" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    
    <!-- Gradients -->
    <linearGradient id="cobalt-grad-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="lime-grad-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4D"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>

    <linearGradient id="card-grad-w" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow-w" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="box-shadow-w" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="tech-grid-w" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#60A5FA" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-radial-w)"/>
  <rect width="1200" height="675" fill="url(#tech-grid-w)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="200" r="160" fill="#2563EB" fill-opacity="0.08" filter="url(#soft-glow-w)"/>
  <circle cx="1020" cy="220" r="180" fill="#C6FF00" fill-opacity="0.07" filter="url(#soft-glow-w)"/>

  <!-- Outer Hairline Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="16" stroke="#2563EB" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 56)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="300" height="34" rx="17" fill="#161F30" stroke="#2563EB" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4.5" fill="#C6FF00"/>
    <text x="32" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">EDITORIAL HYGIENE • WORKFLOW</text>

    <!-- Category Breadcrumb -->
    <text x="320" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">COMMERONIX / CONTENT OPERATIONS &amp; ADSENSE READINESS</text>

    <!-- Right Badge -->
    <rect x="910" y="0" width="170" height="34" rx="8" fill="#161F30" stroke="#334155" stroke-width="1"/>
    <text x="995" y="22" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">ZERO DUPLICATE CONTENT</text>
  </g>

  <!-- Main 4-Stage Progressive Pipeline Workflow -->

  <!-- Stage 01: Raw Draft with Errors -->
  <g transform="translate(60, 115)" filter="url(#box-shadow-w)">
    <rect width="245" height="400" rx="16" fill="url(#card-grad-w)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="42" rx="16" fill="#111827" fill-opacity="0.8"/>
    <!-- Window Dots -->
    <circle cx="20" cy="21" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="21" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="21" r="4.5" fill="#10B981"/>
    <text x="135" y="26" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">01. RAW_DRAFT.MD</text>

    <!-- Content Area -->
    <g transform="translate(18, 56)">
      <!-- Editor Lines Mockup -->
      <g opacity="0.85">
        <text x="0" y="16" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">01</text>
        <text x="24" y="16" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10"># Unformatted text</text>

        <text x="0" y="38" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">02</text>
        <text x="24" y="38" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Initial rough draft...</text>

        <!-- Duplicate Line Strikethrough -->
        <text x="0" y="60" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10">03</text>
        <text x="24" y="60" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="10">duplicate line entry</text>
        <line x1="24" y1="56" x2="160" y2="56" stroke="#EF4444" stroke-width="1.5"/>

        <text x="0" y="82" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10">04</text>
        <text x="24" y="82" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="10">duplicate line entry</text>
        <line x1="24" y1="78" x2="160" y2="78" stroke="#EF4444" stroke-width="1.5"/>

        <text x="0" y="104" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">05</text>
        <text x="24" y="104" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10">iNcoNsiStenT cAsE</text>
      </g>

      <!-- Warning Callout Box -->
      <rect x="0" y="140" width="209" height="110" rx="8" fill="#241215" stroke="#7F1D1D" stroke-width="1"/>
      <text x="14" y="164" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DETECTED FLAWS:</text>
      <text x="14" y="186" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
        • 4 Repeated sentences<br/>
        • Mixed header casing<br/>
        • Trailing whitespace bloat
      </text>
      <rect x="14" y="218" width="180" height="22" rx="4" fill="#7F1D1D"/>
      <text x="104" y="233" text-anchor="middle" fill="#FECACA" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">HIGH BOUNCE RISK</text>

      <!-- Status Pill -->
      <rect x="0" y="280" width="209" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="104" y="301" text-anchor="middle" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">UNCHECKED DRAFT</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 315 315 L 335 315 M 328 308 L 335 315 L 328 322" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stage 02: Automated Text Hygiene & Deduplication -->
  <g transform="translate(345, 115)" filter="url(#box-shadow-w)">
    <rect width="245" height="400" rx="16" fill="url(#card-grad-w)" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="42" rx="16" fill="#111827" fill-opacity="0.8"/>
    <circle cx="20" cy="21" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="21" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="21" r="4.5" fill="#10B981"/>
    <text x="135" y="26" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">02. AUTO-HYGIENE</text>

    <!-- Content Area -->
    <g transform="translate(18, 56)">
      <!-- Transform Nodes -->
      <g transform="translate(0, 0)">
        <rect width="209" height="42" rx="6" fill="#0B1324" stroke="#2563EB" stroke-width="1"/>
        <text x="12" y="26" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Deduplication Engine</text>
        <circle cx="190" cy="21" r="7" fill="#1D4ED8"/>
        <text x="190" y="25" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9">✓</text>
      </g>

      <g transform="translate(0, 52)">
        <rect width="209" height="42" rx="6" fill="#0B1324" stroke="#2563EB" stroke-width="1"/>
        <text x="12" y="26" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Case Normalization</text>
        <circle cx="190" cy="21" r="7" fill="#1D4ED8"/>
        <text x="190" y="25" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9">✓</text>
      </g>

      <g transform="translate(0, 104)">
        <rect width="209" height="42" rx="6" fill="#0B1324" stroke="#2563EB" stroke-width="1"/>
        <text x="12" y="26" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Trailing Space Pruning</text>
        <circle cx="190" cy="21" r="7" fill="#1D4ED8"/>
        <text x="190" y="25" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9">✓</text>
      </g>

      <!-- Stats Box -->
      <g transform="translate(0, 160)">
        <rect width="209" height="90" rx="8" fill="#172554" stroke="#1E40AF" stroke-width="1"/>
        <text x="14" y="24" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">OPTIMIZATION GAIN:</text>
        <text x="14" y="50" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">-18% <tspan fill="#93C5FD" font-size="11">BLOAT</tspan></text>
        <text x="14" y="74" fill="#BFDBFE" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Clean, standard UTF-8 string</text>
      </g>

      <!-- Status Pill -->
      <rect x="0" y="280" width="209" height="32" rx="6" fill="#172554" stroke="#2563EB" stroke-width="1"/>
      <text x="104" y="301" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">TEXT NORMALIZED</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 600 315 L 620 315 M 613 308 L 620 315 L 613 322" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stage 03: Readability & SEO Metrics Audit -->
  <g transform="translate(630, 115)" filter="url(#box-shadow-w)">
    <rect width="245" height="400" rx="16" fill="url(#card-grad-w)" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="42" rx="16" fill="#111827" fill-opacity="0.8"/>
    <circle cx="20" cy="21" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="21" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="21" r="4.5" fill="#10B981"/>
    <text x="135" y="26" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">03. METRIC AUDIT</text>

    <!-- Content Area -->
    <g transform="translate(18, 56)">
      <!-- Metric 1: Reading Time -->
      <g transform="translate(0, 0)">
        <rect width="209" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">READING DURATION</text>
        <text x="12" y="46" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">4.8 Min <tspan fill="#64748B" font-size="11">(1,240 W)</tspan></text>
      </g>

      <!-- Metric 2: Readability Grade -->
      <g transform="translate(0, 68)">
        <rect width="209" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">FLESCH-KINCAID GRADE</text>
        <text x="12" y="46" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Grade 8.2 <tspan fill="#C6FF00" font-size="10">OPTIMAL</tspan></text>
      </g>

      <!-- Metric 3: Keyword Density -->
      <g transform="translate(0, 136)">
        <rect width="209" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">NATURAL KEYWORD WEIGHT</text>
        <text x="12" y="46" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">1.8% <tspan fill="#94A3B8" font-size="10">(NO STUFFING)</tspan></text>
      </g>

      <!-- Target Compliance -->
      <g transform="translate(0, 206)">
        <text x="0" y="16" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
          ✓ Structured H1-H3 flow<br/>
          ✓ Accessible sentence rhythm<br/>
          ✓ High reader retention score
        </text>
      </g>

      <!-- Status Pill -->
      <rect x="0" y="280" width="209" height="32" rx="6" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
      <text x="104" y="301" text-anchor="middle" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">METRICS AUDITED</text>
    </g>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 885 315 L 905 315 M 898 308 L 905 315 L 898 322" stroke="#C6FF00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stage 04: Google AdSense & Publisher Ready -->
  <g transform="translate(915, 115)" filter="url(#box-shadow-w)">
    <rect width="225" height="400" rx="16" fill="url(#card-grad-w)" stroke="#C6FF00" stroke-width="2"/>
    <rect x="0" y="0" width="225" height="42" rx="16" fill="#1E293B" fill-opacity="0.9"/>
    <circle cx="20" cy="21" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="21" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="21" r="4.5" fill="#10B981"/>
    <text x="130" y="26" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">04. PUBLISH READY</text>

    <!-- Content Area -->
    <g transform="translate(18, 56)">
      <!-- Publisher Seal Graphic -->
      <g transform="translate(94, 60)">
        <circle cx="0" cy="0" r="45" fill="#0B1324" stroke="url(#lime-grad-w)" stroke-width="2" filter="url(#soft-glow-w)"/>
        <path d="M -16 0 L -4 14 L 18 -12" fill="none" stroke="#C6FF00" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(0, 130)">
        <text x="94" y="20" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800">AdSense Approved</text>
        <text x="94" y="40" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">EDITORIAL GRADE A+</text>

        <!-- Feature List -->
        <g transform="translate(0, 56)">
          <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
            ✓ 100% Original Text<br/>
            ✓ Schema JSON-LD Attached<br/>
            ✓ High Advertiser RPM Value<br/>
            ✓ Fast Google Indexation
          </text>
        </g>
      </g>

      <!-- Status Pill -->
      <rect x="0" y="280" width="189" height="32" rx="6" fill="#14532D" stroke="#22C55E" stroke-width="1.2" filter="url(#soft-glow-w)"/>
      <text x="94" y="301" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">100% LIVE READY</text>
    </g>
  </g>

  <!-- Bottom Best Practice Quality Bar -->
  <g transform="translate(60, 545)">
    <rect width="1080" height="60" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    
    <g transform="translate(40, 20)">
      <circle cx="8" cy="10" r="4" fill="#C6FF00"/>
      <text x="22" y="15" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">DEDUPLICATION VERIFIED</text>

      <circle cx="280" cy="10" r="4" fill="#C6FF00"/>
      <text x="294" y="15" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">READABILITY GRADE 8-9</text>

      <circle cx="560" cy="10" r="4" fill="#C6FF00"/>
      <text x="574" y="15" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">ORGANIC KEYWORD DENSITY AUDITED</text>

      <circle cx="910" cy="10" r="4" fill="#22C55E"/>
      <text x="924" y="15" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">ADSENSE PASS</text>
    </g>
  </g>
</svg>
