<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad5)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Badge -->
  <rect x="80" y="70" width="200" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1">EDITORIAL WORKFLOW</text>

  <!-- Editorial Pipeline Flow (Cards Left to Right) -->
  <!-- Step 1: Raw Draft -->
  <rect x="100" y="200" width="220" height="310" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.1)"/>
  <rect x="125" y="225" width="40" height="40" rx="8" fill="#334155"/>
  <text x="145" y="250" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">01</text>
  <text x="125" y="295" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Raw Draft</text>
  <text x="125" y="325" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Initial content creation with spelling errors, duplicate lines, and unformatted headings.</text>
  <rect x="125" y="440" width="170" height="30" rx="6" fill="#0B0C10" stroke="#475569" stroke-width="1"/>
  <text x="210" y="460" text-anchor="middle" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="12">UNCHECKED</text>

  <!-- Arrow -->
  <path d="M 335 355 L 365 355 M 355 345 L 365 355 L 355 365" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 2: Automated Hygiene -->
  <rect x="380" y="200" width="220" height="310" rx="14" fill="#161B22" stroke="#2563EB" stroke-width="2"/>
  <rect x="405" y="225" width="40" height="40" rx="8" fill="#2563EB"/>
  <text x="425" y="250" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">02</text>
  <text x="405" y="295" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Deduplication</text>
  <text x="405" y="325" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Remove duplicate sentences, trim trailing spaces, and normalize title casing.</text>
  <rect x="405" y="440" width="170" height="30" rx="6" fill="#0B0C10" stroke="#2563EB" stroke-width="1"/>
  <text x="490" y="460" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12">CLEANED</text>

  <!-- Arrow -->
  <path d="M 615 355 L 645 355 M 635 345 L 645 355 L 635 365" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 3: Readability & SEO Audit -->
  <rect x="660" y="200" width="220" height="310" rx="14" fill="#161B22" stroke="#2563EB" stroke-width="2"/>
  <rect x="685" y="225" width="40" height="40" rx="8" fill="#2563EB"/>
  <text x="705" y="250" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">03</text>
  <text x="685" y="295" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">Readability</text>
  <text x="685" y="325" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Calculate reading time, Flesch-Kincaid score, and verify natural keyword density (1.5-2%).</text>
  <rect x="685" y="440" width="170" height="30" rx="6" fill="#0B0C10" stroke="#2563EB" stroke-width="1"/>
  <text x="770" y="460" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12">VERIFIED</text>

  <!-- Arrow -->
  <path d="M 895 355 L 925 355 M 915 345 L 925 355 L 915 365" stroke="#C6FF00" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 4: Publish Ready -->
  <rect x="940" y="200" width="220" height="310" rx="14" fill="#161B22" stroke="#C6FF00" stroke-width="2" filter="url(#glow5)"/>
  <rect x="965" y="225" width="40" height="40" rx="8" fill="#C6FF00"/>
  <text x="985" y="250" text-anchor="middle" fill="#0B0C10" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">✓</text>
  <text x="965" y="295" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">AdSense Ready</text>
  <text x="965" y="325" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Schema Article LD+JSON embedded, H1-H3 hierarchy locked, ready for indexing.</text>
  <rect x="965" y="440" width="170" height="30" rx="6" fill="#0B0C10" stroke="#C6FF00" stroke-width="1"/>
  <text x="1050" y="460" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="12">100% READY</text>

  <!-- Bottom Checklist -->
  <rect x="100" y="550" width="1060" height="50" rx="10" fill="#161B22" stroke="#2563EB" stroke-width="1"/>
  <text x="630" y="581" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">WORD COUNT AUDITED · DUPLICATE LINES REMOVED · URL SLUG STANDARDIZED</text>
</svg>
