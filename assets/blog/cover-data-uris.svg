<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad8" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad8)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1">WEB PERFORMANCE OPT</text>

  <!-- Left: Traditional External Image Request -->
  <rect x="120" y="180" width="420" height="340" rx="16" fill="#161B22" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <text x="155" y="225" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">EXTERNAL HTTP ASSET</text>
  
  <rect x="155" y="250" width="350" height="110" rx="10" fill="#0B0C10" stroke="#334155" stroke-width="1"/>
  <text x="175" y="285" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13">&lt;img src="/icon.svg"&gt;</text>
  <text x="175" y="315" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="14">❌ +1 DNS &amp; TLS Handshake</text>
  <text x="175" y="340" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="14">❌ Extra Round-Trip (RTT)</text>

  <rect x="155" y="380" width="350" height="110" rx="10" fill="#0B0C10" stroke="#334155" stroke-width="1"/>
  <text x="175" y="415" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Best for large images, photographs, and media that benefit from browser cache.</text>

  <!-- Right: Inlined Base64 Data URI -->
  <rect x="660" y="180" width="420" height="340" rx="16" fill="#161B22" stroke="#C6FF00" stroke-width="2" filter="url(#glow8)"/>
  <text x="695" y="225" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">INLINED DATA URI (BASE64)</text>

  <rect x="695" y="250" width="350" height="110" rx="10" fill="#0B0C10" stroke="#C6FF00" stroke-width="1"/>
  <text x="715" y="285" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13">data:image/svg+xml;base64,...</text>
  <text x="715" y="315" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14">✓ 0 HTTP Requests</text>
  <text x="715" y="340" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14">✓ Instant Critical Render</text>

  <rect x="695" y="380" width="350" height="110" rx="10" fill="#0B0C10" stroke="rgba(198,255,0,0.3)" stroke-width="1"/>
  <text x="715" y="415" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Best for micro-icons, CSS sprites, splash screens, and zero-latency layout icons.</text>

  <!-- Bottom Comparison -->
  <rect x="120" y="555" width="960" height="50" rx="10" fill="#161B22" stroke="#2563EB" stroke-width="1"/>
  <text x="600" y="586" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">RULE OF THUMB: INLINE ASSETS &lt; 2 KB · AVOID BASE64 FOR LARGE HERO MEDIA</text>
</svg>
