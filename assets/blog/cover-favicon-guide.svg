      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="cobalt-grad-fg" x1="0%" y1="0%" x2="100%" y2="100%">
