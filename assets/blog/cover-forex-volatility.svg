<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad7" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad7)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Badge -->
  <rect x="80" y="70" width="190" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1">GLOBAL FINANCE</text>

  <!-- Forex Volatility Candlesticks and Pulse Wave -->
  <g transform="translate(160, 180)">
    <rect x="0" y="0" width="880" height="340" rx="16" fill="#161B22" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    
    <!-- Exchange rate candles -->
    <!-- Candle 1 -->
    <line x1="120" y1="80" x2="120" y2="240" stroke="#64748B" stroke-width="2"/>
    <rect x="105" y="120" width="30" height="80" fill="#2563EB" rx="4"/>
    
    <!-- Candle 2 -->
    <line x1="220" y1="60" x2="220" y2="220" stroke="#64748B" stroke-width="2"/>
    <rect x="205" y="90" width="30" height="100" fill="#C6FF00" rx="4" filter="url(#glow7)"/>

    <!-- Candle 3 -->
    <line x1="320" y1="100" x2="320" y2="260" stroke="#64748B" stroke-width="2"/>
    <rect x="305" y="140" width="30" height="90" fill="#2563EB" rx="4"/>

    <!-- Mid-market pulse line -->
    <path d="M 60 210 Q 200 80 350 170 T 650 110 T 820 150" fill="none" stroke="#C6FF00" stroke-width="4" filter="url(#glow7)"/>

    <!-- Currency Pair Pills Floating -->
    <rect x="420" y="80" width="180" height="44" rx="8" fill="#0B0C10" stroke="#2563EB" stroke-width="1.5"/>
    <text x="510" y="108" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">USD / EUR: 0.8614</text>

    <rect x="640" y="190" width="180" height="44" rx="8" fill="#0B0C10" stroke="#C6FF00" stroke-width="1.5" filter="url(#glow7)"/>
    <text x="730" y="218" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">USD / PKR: 277.25</text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="160" y="555" width="880" height="50" rx="10" fill="#161B22" stroke="#2563EB" stroke-width="1"/>
  <text x="600" y="586" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">REAL-TIME MID-MARKET REFERENCE · MITIGATING BANK SPREADS · ZERO DELAY</text>
</svg>
