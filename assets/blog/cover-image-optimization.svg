<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4D"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 16:9 Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Tech Grid Accent -->
  <g stroke="#2563EB" stroke-width="1" stroke-opacity="0.12">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Brand Badge Top Left -->
  <rect x="80" y="70" width="180" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">COMMERONIX SEO</text>

  <!-- Main Illustration: Image Compression & Core Web Vitals Pipeline -->
  <!-- Left Source Card (Large RAW / Heavy Image) -->
  <rect x="140" y="220" width="260" height="280" rx="16" fill="#161B22" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="160" y="240" width="220" height="150" rx="10" fill="#0B0C10" stroke="#334155" stroke-width="1"/>
  <!-- Image mountain / sun symbol inside -->
  <circle cx="210" cy="285" r="18" fill="#64748B"/>
  <polygon points="175,370 235,300 280,345 320,310 365,370" fill="#475569"/>
  <text x="160" y="425" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="14">FORMAT: RAW JPEG</text>
  <text x="160" y="452" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">3.8 MB (SLOW LCP)</text>

  <!-- Compression Transformation Engine (Center) -->
  <g filter="url(#glow)">
    <circle cx="600" cy="360" r="70" fill="#161B22" stroke="url(#blueGrad)" stroke-width="4"/>
    <path d="M 570 360 L 630 360 M 610 340 L 630 360 L 610 380" stroke="#C6FF00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="460" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">CANVAS WEBP ENGINE</text>
    <text x="600" y="485" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">-88% PAYLOAD REDUCTION</text>
  </g>

  <!-- Right Target Card (Optimized WebP / Next-Gen Image) -->
  <rect x="800" y="220" width="260" height="280" rx="16" fill="#161B22" stroke="#2563EB" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="820" y="240" width="220" height="150" rx="10" fill="#0B0C10" stroke="#2563EB" stroke-width="1"/>
  <!-- Optimized mountain / sun with vibrant colors -->
  <circle cx="870" cy="285" r="18" fill="#C6FF00"/>
  <polygon points="835,370 895,300 940,345 980,310 1025,370" fill="url(#blueGrad)"/>
  <text x="820" y="425" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="14">FORMAT: WEBP (16:9)</text>
  <text x="820" y="452" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">42 KB (FAST 100/100)</text>

  <!-- Performance Metric Badge Bottom Right -->
  <rect x="800" y="525" width="260" height="40" rx="8" fill="rgba(198,255,0,0.12)" stroke="#C6FF00" stroke-width="1.5"/>
  <text x="930" y="550" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">CORE WEB VITALS: PASS</text>
</svg>
