<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-radial" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    
    <!-- Cobalt & Lime Gradients -->
    <linearGradient id="cobalt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="lime-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4D"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="box-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#60A5FA" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-radial)"/>
  <rect width="1200" height="675" fill="url(#tech-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#2563EB" fill-opacity="0.08" filter="url(#soft-glow)"/>
  <circle cx="1020" cy="220" r="180" fill="#C6FF00" fill-opacity="0.06" filter="url(#soft-glow)"/>

  <!-- Outer Hairline Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="16" stroke="#2563EB" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 56)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#161F30" stroke="#2563EB" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4.5" fill="#C6FF00"/>
    <text x="32" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CORE WEB VITALS • LCP</text>

    <!-- Category Breadcrumb -->
    <text x="250" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">COMMERONIX / WEB PERFORMANCE ENGINEERING</text>

    <!-- Right Stat Badge -->
    <rect x="910" y="0" width="170" height="34" rx="8" fill="#161F30" stroke="#334155" stroke-width="1"/>
    <text x="995" y="22" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace, Consolas" font-size="12" font-weight="600">⚡ 16:9 NEXT-GEN</text>
  </g>

  <!-- Main Pipeline Architecture Visual -->

  <!-- Left Card: Unoptimized Legacy Asset -->
  <g transform="translate(60, 120)" filter="url(#box-shadow)">
    <!-- Card Frame -->
    <rect width="320" height="390" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="42" rx="16" fill="#111827" fill-opacity="0.8"/>
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>
    <text x="160" y="26" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RAW_ASSET.JPG</text>

    <!-- Image Preview Area with Grid -->
    <rect x="20" y="58" width="280" height="150" rx="10" fill="#0B0C10" stroke="#1E293B" stroke-width="1"/>
    <!-- Photo Illustration: Mountains & Sun -->
    <path d="M 40 180 L 110 110 L 170 170 L 220 125 L 280 185 Z" fill="#334155" opacity="0.6"/>
    <path d="M 120 180 L 180 130 L 250 180 Z" fill="#475569" opacity="0.8"/>
    <circle cx="90" cy="95" r="16" fill="#64748B"/>
    <!-- Pixelated Grid Overlay over unoptimized image -->
    <path d="M 20 95 L 300 95 M 20 135 L 300 135 M 20 175 L 300 175 M 90 58 L 90 208 M 160 58 L 160 208 M 230 58 L 230 208" stroke="#EF4444" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4"/>
    <rect x="180" y="70" width="110" height="24" rx="4" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="235" y="86" text-anchor="middle" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">UNCOMPRESSED</text>

    <!-- Metrics Breakdown -->
    <g transform="translate(20, 230)">
      <text x="0" y="16" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">PAYLOAD SIZE</text>
      <text x="0" y="42" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">3,840 KB</text>
      <line x1="0" y1="56" x2="280" y2="56" stroke="#1E293B" stroke-width="1"/>

      <text x="0" y="78" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">LCP LATENCY</text>
      <text x="0" y="104" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">4.20s <tspan fill="#EF4444" font-size="12">(POOR SCORE)</tspan></text>
      
      <rect x="0" y="118" width="280" height="24" rx="6" fill="#2D1515"/>
      <text x="140" y="134" text-anchor="middle" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">⚠ Layout Shift Hazard &amp; Slow Bandwidth</text>
    </g>
  </g>

  <!-- Center Pipeline / Canvas Engine -->
  <g transform="translate(420, 190)">
    <!-- Data Stream Wave -->
    <path d="M -20 110 C 60 110, 80 40, 180 40 C 280 40, 300 110, 380 110" fill="none" stroke="url(#stream-grad)" stroke-width="3" stroke-dasharray="6 4"/>
    
    <!-- Central Processing Core -->
    <rect x="85" y="45" width="190" height="150" rx="16" fill="#0B1324" stroke="#2563EB" stroke-width="2" filter="url(#box-shadow)"/>
    
    <!-- Chip Micro-pins -->
    <line x1="120" y1="45" x2="120" y2="35" stroke="#60A5FA" stroke-width="2"/>
    <line x1="150" y1="45" x2="150" y2="35" stroke="#60A5FA" stroke-width="2"/>
    <line x1="180" y1="45" x2="180" y2="35" stroke="#60A5FA" stroke-width="2"/>
    <line x1="210" y1="45" x2="210" y2="35" stroke="#60A5FA" stroke-width="2"/>

    <line x1="120" y1="195" x2="120" y2="205" stroke="#60A5FA" stroke-width="2"/>
    <line x1="150" y1="195" x2="150" y2="205" stroke="#60A5FA" stroke-width="2"/>
    <line x1="180" y1="195" x2="180" y2="205" stroke="#60A5FA" stroke-width="2"/>
    <line x1="210" y1="195" x2="210" y2="205" stroke="#60A5FA" stroke-width="2"/>

    <!-- Processor Core Content -->
    <circle cx="180" cy="95" r="24" fill="#1E293B" stroke="url(#lime-grad)" stroke-width="2"/>
    <path d="M 172 95 L 188 95 M 182 89 L 188 95 L 182 101" stroke="#C6FF00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="180" y="140" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">CANVAS WEBP/AVIF</text>
    <text x="180" y="158" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ZERO-SERVER CLIENT</text>

    <!-- Reduction Pill Floating -->
    <rect x="95" y="215" width="170" height="34" rx="17" fill="#14532D" stroke="#22C55E" stroke-width="1.2" filter="url(#soft-glow)"/>
    <text x="180" y="236" text-anchor="middle" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">↓ 91.4% PAYLOAD</text>
  </g>

  <!-- Right Card: Optimized WebP Asset -->
  <g transform="translate(820, 120)" filter="url(#box-shadow)">
    <!-- Card Frame with Cobalt Glow -->
    <rect width="320" height="390" rx="16" fill="url(#card-grad)" stroke="#2563EB" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="42" rx="16" fill="#1E293B" fill-opacity="0.9"/>
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>
    <text x="160" y="26" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">OPTIMIZED_ASSET.WEBP</text>

    <!-- Image Preview Area: Crisp, Vibrant, Razor-Sharp -->
    <rect x="20" y="58" width="280" height="150" rx="10" fill="#0B0C10" stroke="#2563EB" stroke-width="1.2"/>
    <!-- Optimized Vibrant Artwork -->
    <path d="M 40 180 L 110 110 L 170 170 L 220 125 L 280 185 Z" fill="url(#cobalt-grad)" opacity="0.9"/>
    <path d="M 120 180 L 180 130 L 250 180 Z" fill="#3B82F6" opacity="0.7"/>
    <circle cx="90" cy="95" r="16" fill="url(#lime-grad)" filter="url(#soft-glow)"/>
    
    <!-- 16:9 Aspect Ratio Guide Marks -->
    <path d="M 28 66 L 40 66 M 28 66 L 28 78 M 292 66 L 280 66 M 292 66 L 292 78 M 28 200 L 40 200 M 28 200 L 28 188 M 292 200 L 280 200 M 292 200 L 292 188" stroke="#C6FF00" stroke-width="1.5"/>
    <rect x="180" y="70" width="110" height="24" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="235" y="86" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">✓ WEBP (16:9)</text>

    <!-- Metrics Breakdown -->
    <g transform="translate(20, 230)">
      <text x="0" y="16" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">COMPRESSED FILE SIZE</text>
      <text x="0" y="42" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">48 KB <tspan fill="#60A5FA" font-size="13">(-91%)</tspan></text>
      <line x1="0" y1="56" x2="280" y2="56" stroke="#1E293B" stroke-width="1"/>

      <text x="0" y="78" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">CORE WEB VITALS LCP</text>
      <text x="0" y="104" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">0.65s <tspan fill="#C6FF00" font-size="12">(GOOD • FAST)</tspan></text>
      
      <rect x="0" y="118" width="280" height="24" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="140" y="134" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">✓ Zero Layout Shift (CLS 0.00)</text>
    </g>
  </g>

  <!-- Bottom Core Web Vitals Status Bar -->
  <g transform="translate(60, 545)">
    <rect width="1080" height="60" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Indicator 1: LCP -->
    <g transform="translate(30, 18)">
      <circle cx="12" cy="12" r="6" fill="#22C55E"/>
      <text x="28" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">LCP: <tspan fill="#4ADE80" font-family="'JetBrains Mono', monospace">0.65s</tspan></text>
      <text x="145" y="16" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">(Target &lt; 2.5s)</text>
    </g>

    <line x1="370" y1="12" x2="370" y2="48" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Indicator 2: CLS -->
    <g transform="translate(400, 18)">
      <circle cx="12" cy="12" r="6" fill="#22C55E"/>
      <text x="28" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">CLS: <tspan fill="#4ADE80" font-family="'JetBrains Mono', monospace">0.000</tspan></text>
      <text x="145" y="16" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">(Target &lt; 0.10)</text>
    </g>

    <line x1="730" y1="12" x2="730" y2="48" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Indicator 3: Formats -->
    <g transform="translate(760, 18)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">WEBP</text>

      <rect x="80" y="0" width="65" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="112" y="16" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AVIF</text>

      <rect x="155" y="0" width="135" height="24" rx="4" fill="#14532D" stroke="#22C55E" stroke-width="1"/>
      <text x="222" y="16" text-anchor="middle" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">100/100 AUDIT</text>
    </g>
  </g>
</svg>
