<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad4)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1">PERFORMANCE ENGINEERING</text>

  <!-- Speedometer / Performance Arc (Center) -->
  <g transform="translate(600, 310)">
    <path d="M -160 0 A 160 160 0 0 1 160 0" stroke="#334155" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M -160 0 A 160 160 0 0 1 140 -80" stroke="#2563EB" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 60 -150 A 160 160 0 0 1 160 0" stroke="#C6FF00" stroke-width="26" stroke-linecap="round" fill="none" filter="url(#glow4)"/>
    
    <circle cx="0" cy="0" r="28" fill="#161B22" stroke="#2563EB" stroke-width="4"/>
    <line x1="0" y1="0" x2="90" y2="-90" stroke="#C6FF00" stroke-width="6" stroke-linecap="round" filter="url(#glow4)"/>
    
    <text x="0" y="65" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="800">100 / 100</text>
    <text x="0" y="95" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">GOOGLE LIGHTHOUSE AUDIT</text>
  </g>

  <!-- Left Card: Zero Server Latency -->
  <rect x="140" y="440" width="280" height="150" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.12)"/>
  <text x="165" y="475" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">0 MS NETWORK DELAY</text>
  <text x="165" y="505" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Client-side execution eliminates HTTP request queues and server compute lag.</text>

  <!-- Middle Card: INP / FID Responsiveness -->
  <rect x="460" y="440" width="280" height="150" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.12)"/>
  <text x="485" y="475" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">&lt; 50 MS INTERACTION</text>
  <text x="485" y="505" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Instant DOM feedback ensures exceptional Interaction to Next Paint (INP) scores.</text>

  <!-- Right Card: 0 Cumulative Layout Shift -->
  <rect x="780" y="440" width="280" height="150" rx="14" fill="#161B22" stroke="#C6FF00" stroke-width="1.5" filter="url(#glow4)"/>
  <text x="805" y="475" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">0.00 CLS STABILITY</text>
  <text x="805" y="505" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Fixed dimension wrappers prevent unexpected layout reflows during image loading.</text>
</svg>
