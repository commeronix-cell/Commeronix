<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-radial-l" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    
    <!-- Gradients -->
    <linearGradient id="cobalt-grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="lime-grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4D"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>

    <linearGradient id="card-grad-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Arc Gradient for Speedometer -->
    <linearGradient id="speed-arc-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#C6FF00"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow-l" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="box-shadow-l" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="tech-grid-l" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563EB" stroke-width="1" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#60A5FA" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-radial-l)"/>
  <rect width="1200" height="675" fill="url(#tech-grid-l)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="240" r="220" fill="#2563EB" fill-opacity="0.08" filter="url(#soft-glow-l)"/>
  <circle cx="980" cy="200" r="160" fill="#C6FF00" fill-opacity="0.07" filter="url(#soft-glow-l)"/>

  <!-- Outer Hairline Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="16" stroke="#2563EB" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <g transform="translate(60, 56)">
    <!-- Brand / Topic Badge -->
    <rect x="0" y="0" width="290" height="34" rx="17" fill="#161F30" stroke="#2563EB" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4.5" fill="#C6FF00"/>
    <text x="32" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">WEB PERFORMANCE • CLIENT-SIDE</text>

    <!-- Category Breadcrumb -->
    <text x="310" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">COMMERONIX / ZERO-SERVER RUNTIME ARCHITECTURE</text>

    <!-- Right Badge -->
    <rect x="910" y="0" width="170" height="34" rx="8" fill="#161F30" stroke="#334155" stroke-width="1"/>
    <text x="995" y="22" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">0 MS SERVER LATENCY</text>
  </g>

  <!-- Main Visual: Telemetry Hub & Architecture Comparison -->

  <!-- Left Card: Legacy Server Roundtrips -->
  <g transform="translate(60, 115)" filter="url(#box-shadow-l)">
    <rect width="320" height="400" rx="16" fill="url(#card-grad-l)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="42" rx="16" fill="#111827" fill-opacity="0.8"/>
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>
    <text x="160" y="26" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SERVER-SIDE ROUNDTRIP</text>

    <!-- Content: Network Waterfall & Hops -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">1,840 MS TOTAL LATENCY</text>

      <!-- Network Hops Pipeline -->
      <g transform="translate(0, 32)">
        <!-- Hop 1 -->
        <rect width="272" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">DNS Resolution &amp; TLS Handshake</text>
        <text x="260" y="24" text-anchor="end" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">180ms</text>

        <!-- Hop 2 -->
        <rect y="48" width="272" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Backend Cloud Compute Queue</text>
        <text x="260" y="72" text-anchor="end" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">620ms</text>

        <!-- Hop 3 -->
        <rect y="96" width="272" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="120" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Database / File IO Serialization</text>
        <text x="260" y="120" text-anchor="end" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">450ms</text>

        <!-- Hop 4 -->
        <rect y="144" width="272" height="40" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="12" y="168" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Downlink Asset Transfer</text>
        <text x="260" y="168" text-anchor="end" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">590ms</text>
      </g>

      <!-- Drawbacks -->
      <g transform="translate(0, 235)">
        <rect width="272" height="48" rx="8" fill="#2A1215" stroke="#7F1D1D" stroke-width="1"/>
        <text x="136" y="24" text-anchor="middle" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">⚠ High Cloud Bill &amp; Infrastructure Bottlenecks</text>
        <text x="136" y="40" text-anchor="middle" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10">USER DATA EXPOSED OVER WIRE</text>
      </g>
    </g>
  </g>

  <!-- Center Card: Lighthouse 100 Speedometer Core -->
  <g transform="translate(410, 115)" filter="url(#box-shadow-l)">
    <rect width="380" height="400" rx="16" fill="url(#card-grad-l)" stroke="#2563EB" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="42" rx="16" fill="#1E293B" fill-opacity="0.9"/>
    <text x="190" y="26" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GOOGLE LIGHTHOUSE AUDIT: 100/100</text>

    <!-- Speedometer Graphic -->
    <g transform="translate(190, 205)">
      <!-- Outer Track Arc -->
      <path d="M -130 30 A 135 135 0 1 1 130 30" fill="none" stroke="#1E293B" stroke-width="20" stroke-linecap="round"/>
      
      <!-- Progress Active Arc (Electric Cobalt to Acid Lime) -->
      <path d="M -130 30 A 135 135 0 1 1 128 35" fill="none" stroke="url(#speed-arc-grad)" stroke-width="20" stroke-linecap="round" filter="url(#soft-glow-l)"/>
      
      <!-- Center Needle Reticle -->
      <circle cx="0" cy="15" r="28" fill="#0B0C10" stroke="#2563EB" stroke-width="3"/>
      <!-- Needle Pointing to 100% Top Right -->
      <line x1="0" y1="15" x2="80" y2="-65" stroke="#C6FF00" stroke-width="5" stroke-linecap="round" filter="url(#soft-glow-l)"/>
      <circle cx="0" cy="15" r="10" fill="#C6FF00"/>

      <!-- Large Score Numbers -->
      <text x="0" y="70" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="38" font-weight="900">100</text>
      <text x="0" y="94" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">PERFECT PERFORMANCE</text>
    </g>

    <!-- Core Web Vitals Micro Dashboard -->
    <g transform="translate(24, 325)">
      <rect width="332" height="52" rx="10" fill="#0B0C10" stroke="#334155" stroke-width="1"/>
      
      <g transform="translate(16, 16)">
        <text x="0" y="12" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">FCP</text>
        <text x="0" y="28" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">0.4s</text>
      </g>

      <line x1="85" y1="10" x2="85" y2="42" stroke="#1E293B" stroke-width="1"/>

      <g transform="translate(100, 16)">
        <text x="0" y="12" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">LCP</text>
        <text x="0" y="28" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">0.65s</text>
      </g>

      <line x1="168" y1="10" x2="168" y2="42" stroke="#1E293B" stroke-width="1"/>

      <g transform="translate(182, 16)">
        <text x="0" y="12" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">INP</text>
        <text x="0" y="28" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">18ms</text>
      </g>

      <line x1="250" y1="10" x2="250" y2="42" stroke="#1E293B" stroke-width="1"/>

      <g transform="translate(265, 16)">
        <text x="0" y="12" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">CLS</text>
        <text x="0" y="28" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">0.00</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Commeronix Zero-Server Client Architecture -->
  <g transform="translate(820, 115)" filter="url(#box-shadow-l)">
    <rect width="320" height="400" rx="16" fill="url(#card-grad-l)" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="42" rx="16" fill="#111827" fill-opacity="0.8"/>
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>
    <text x="160" y="26" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">COMMERONIX CLIENT RUNTIME</text>

    <!-- Content: Zero Server Latency -->
    <g transform="translate(24, 60)">
      <text x="0" y="16" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">0 MS NETWORK DELAY</text>

      <!-- Client Execution Stages -->
      <g transform="translate(0, 32)">
        <rect width="272" height="40" rx="6" fill="#0B1324" stroke="#2563EB" stroke-width="1"/>
        <text x="12" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Client Local In-Memory RAM</text>
        <text x="260" y="24" text-anchor="end" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">INSTANT</text>

        <rect y="48" width="272" height="40" rx="6" fill="#0B1324" stroke="#2563EB" stroke-width="1"/>
        <text x="12" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">HTML5 Canvas Web API Engine</text>
        <text x="260" y="72" text-anchor="end" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">HARDWARE</text>

        <rect y="96" width="272" height="40" rx="6" fill="#0B1324" stroke="#2563EB" stroke-width="1"/>
        <text x="12" y="120" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Zero Backend Dependency</text>
        <text x="260" y="120" text-anchor="end" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">0 LATENCY</text>

        <rect y="144" width="272" height="40" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
        <text x="12" y="168" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Privacy: Data Never Leaves Browser</text>
        <text x="260" y="168" text-anchor="end" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">100%</text>
      </g>

      <!-- Benefits -->
      <g transform="translate(0, 235)">
        <rect width="272" height="48" rx="8" fill="#14532D" stroke="#22C55E" stroke-width="1"/>
        <text x="136" y="24" text-anchor="middle" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">✓ Lightning Fast UX • High Conversion</text>
        <text x="136" y="40" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="10">SUB-50MS INTERACTION SPEED</text>
      </g>
    </g>
  </g>

  <!-- Bottom Core Metrics Bar -->
  <g transform="translate(60, 545)">
    <rect width="1080" height="60" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    
    <g transform="translate(40, 20)">
      <circle cx="8" cy="10" r="4" fill="#C6FF00"/>
      <text x="22" y="15" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">0 MS SERVER LATENCY</text>

      <circle cx="280" cy="10" r="4" fill="#C6FF00"/>
      <text x="294" y="15" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">ZERO RUNTIME BLOAT</text>

      <circle cx="560" cy="10" r="4" fill="#C6FF00"/>
      <text x="574" y="15" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">100/100 LIGHTHOUSE MOBILE &amp; DESKTOP</text>

      <circle cx="910" cy="10" r="4" fill="#22C55E"/>
      <text x="924" y="15" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">PASSES ALL CWV</text>
    </g>
  </g>
</svg>
