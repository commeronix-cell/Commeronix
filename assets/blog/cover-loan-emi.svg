<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad6" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad6)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1">FINANCIAL MATHEMATICS</text>

  <!-- Loan Amortization Visual Curve (Center) -->
  <g transform="translate(160, 180)">
    <!-- Curve Frame -->
    <rect x="0" y="0" width="880" height="340" rx="16" fill="#161B22" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    
    <!-- Grid lines -->
    <line x1="60" y1="60" x2="820" y2="60" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="60" y1="140" x2="820" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="60" y1="220" x2="820" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="6 6"/>
    <line x1="60" y1="280" x2="820" y2="280" stroke="#475569" stroke-width="2"/>
    <line x1="60" y1="40" x2="60" y2="280" stroke="#475569" stroke-width="2"/>

    <!-- Reducing Balance Principal Curve -->
    <path d="M 60 70 Q 300 130 500 200 T 820 280" fill="none" stroke="#2563EB" stroke-width="5" filter="url(#glow6)"/>
    <text x="520" y="180" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">PRINCIPAL BALANCE CURVE</text>

    <!-- Monthly Interest Portion (Decreasing) -->
    <path d="M 60 140 Q 350 200 820 280" fill="none" stroke="#C6FF00" stroke-width="4" stroke-dasharray="8 4" filter="url(#glow6)"/>
    <text x="260" y="125" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="13">MONTHLY INTEREST PORTION (DECREASING)</text>

    <!-- Interactive Node Highlight -->
    <circle cx="500" cy="200" r="8" fill="#C6FF00" filter="url(#glow6)"/>
    <circle cx="500" cy="200" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Metric Pills Bottom -->
  <rect x="160" y="555" width="260" height="48" rx="10" fill="#161B22" stroke="#2563EB" stroke-width="1"/>
  <text x="290" y="585" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="14">REDUCING BALANCE</text>

  <rect x="470" y="555" width="260" height="48" rx="10" fill="#161B22" stroke="#2563EB" stroke-width="1"/>
  <text x="600" y="585" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="14">COMPOUND EMI FORMULA</text>

  <rect x="780" y="555" width="260" height="48" rx="10" fill="#161B22" stroke="#C6FF00" stroke-width="1.5" filter="url(#glow6)"/>
  <text x="910" y="585" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">FULL AMORTIZATION</text>
</svg>
