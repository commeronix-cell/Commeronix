<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad2)"/>
  <rect x="2" y="2" width="1196" height="671" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Technical SEO Slugs Visual Diagram -->
  <rect x="80" y="70" width="180" height="36" rx="18" fill="rgba(37,99,235,0.12)" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="102" cy="88" r="5" fill="#C6FF00"/>
  <text x="116" y="93" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1">TECHNICAL SEO</text>

  <!-- URL Browser Bar Mockup -->
  <rect x="150" y="160" width="900" height="74" rx="16" fill="#161B22" stroke="#2563EB" stroke-width="2" filter="url(#glow2)"/>
  <circle cx="185" cy="197" r="7" fill="#EF4444"/>
  <circle cx="210" cy="197" r="7" fill="#F59E0B"/>
  <circle cx="235" cy="197" r="7" fill="#10B981"/>

  <rect x="270" y="177" width="750" height="40" rx="8" fill="#0B0C10" stroke="rgba(255,255,255,0.1)"/>
  <text x="290" y="202" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="15">https://commeronix.com/</text>
  <text x="515" y="202" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">blog/url-slug-optimization-technical-seo</text>

  <!-- Deconstruction Nodes -->
  <!-- Node 1: Protocol & Domain -->
  <rect x="180" y="300" width="240" height="180" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.12)"/>
  <text x="205" y="340" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">01. ROOT DOMAIN</text>
  <text x="205" y="380" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Canonical authority structure, SSL/HTTPS encryption, and breadcrumb base.</text>
  <rect x="205" y="430" width="100" height="26" rx="4" fill="rgba(37,99,235,0.15)"/>
  <text x="255" y="447" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12">CANONICAL</text>

  <!-- Node 2: Category Directory -->
  <rect x="480" y="300" width="240" height="180" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.12)"/>
  <text x="505" y="340" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">02. TAXONOMY</text>
  <text x="505" y="380" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Semantic parent category hierarchy for search engine crawlers and crawlbility.</text>
  <rect x="505" y="430" width="100" height="26" rx="4" fill="rgba(37,99,235,0.15)"/>
  <text x="555" y="447" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12">/BLOG/ HUB</text>

  <!-- Node 3: Target Keyword Slug -->
  <rect x="780" y="300" width="270" height="180" rx="14" fill="#161B22" stroke="#C6FF00" stroke-width="2" filter="url(#glow2)"/>
  <text x="805" y="340" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">03. CLEAN SLUG</text>
  <text x="805" y="380" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">No stop words. Hyphen-separated keyword targets. Maximizes search CTR.</text>
  <rect x="805" y="430" width="140" height="26" rx="4" fill="rgba(198,255,0,0.15)"/>
  <text x="875" y="447" text-anchor="middle" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="12">SEO OPTIMIZED</text>

  <!-- Bottom Checklist Banner -->
  <rect x="150" y="530" width="900" height="60" rx="12" fill="#161B22" stroke="#2563EB" stroke-width="1"/>
  <text x="180" y="566" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="16">✓ LOWERCASE ONLY</text>
  <text x="430" y="566" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="16">✓ HYPHEN SEPARATION</text>
  <text x="710" y="566" fill="#C6FF00" font-family="'JetBrains Mono', monospace" font-size="16">✓ ZERO STOP-WORDS</text>
</svg>
