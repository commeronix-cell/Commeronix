<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Midnight Black Base Gradient -->
    <radialGradient id="favBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="70%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Electric Cobalt Blue Gradient -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Acid Lime Highlight Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9FF00"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="cobaltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="limeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Midnight Black Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#favBg)"/>
  <rect x="6" y="6" width="500" height="500" rx="122" stroke="#2563EB" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Geometric Subtle Tech Grid Background -->
  <g opacity="0.12" stroke="#2563EB" stroke-width="2">
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
  </g>

  <!-- Bold Modern "C" Monogram with Cobalt Blue Gradient -->
  <path d="M 370 148 C 340 120 295 108 248 108 C 158 108 92 174 92 256 C 92 338 158 404 248 404 C 298 404 342 390 372 360"
        stroke="url(#cobaltGrad)"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#cobaltGlow)"/>

  <!-- Inner Dynamic Modern Tech Arc with Acid Lime -->
  <path d="M 326 200 C 304 184 276 176 248 176 C 204 176 168 212 168 256 C 168 300 204 336 248 336 C 278 336 304 326 326 308"
        stroke="url(#limeGrad)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#limeGlow)"/>

  <!-- High-Precision Digital Apex / Utility Sparks in Acid Lime -->
  <!-- Top Spark Node -->
  <circle cx="370" cy="148" r="16" fill="#C6FF00" filter="url(#limeGlow)"/>
  <circle cx="370" cy="148" r="8" fill="#FFFFFF"/>

  <!-- Bottom Spark Node -->
  <circle cx="372" cy="360" r="16" fill="#C6FF00" filter="url(#limeGlow)"/>
  <circle cx="372" cy="360" r="8" fill="#FFFFFF"/>

  <!-- Central Utility Pivot / Core Node -->
  <circle cx="248" cy="256" r="22" fill="#2563EB" filter="url(#cobaltGlow)"/>
  <circle cx="248" cy="256" r="12" fill="#C6FF00"/>
  <circle cx="248" cy="256" r="5" fill="#FFFFFF"/>

  <!-- Dynamic Precision Accent Rays -->
  <line x1="248" y1="210" x2="248" y2="190" stroke="#C6FF00" stroke-width="6" stroke-linecap="round"/>
  <line x1="248" y1="302" x2="248" y2="322" stroke="#C6FF00" stroke-width="6" stroke-linecap="round"/>
  <line x1="202" y1="256" x2="182" y2="256" stroke="#C6FF00" stroke-width="6" stroke-linecap="round"/>
  <line x1="294" y1="256" x2="314" y2="256" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
</svg>
