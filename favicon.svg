<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="favBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>

    <!-- Brand Cyan-Emerald Gradient -->
    <linearGradient id="favBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#00D2D3"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect width="512" height="512" rx="120" fill="url(#favBgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="url(#cardStroke)" stroke-width="3"/>

  <!-- Mathematical Precision Crosshair Grid -->
  <g stroke="url(#favBrandGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9" filter="url(#neonFilter)">
    <!-- Vertical Crosshair Axis -->
    <line x1="256" y1="90" x2="256" y2="422"/>
    
    <!-- Horizontal Crosshair Axis -->
    <line x1="90" y1="256" x2="422" y2="256"/>

    <!-- Outer Concentric Arcs / Precision "C" Frame -->
    <path d="M 370 170 A 150 150 0 1 0 370 342" fill="none" stroke-width="18"/>
    <path d="M 340 195 A 110 110 0 1 0 340 317" fill="none" stroke-width="12"/>
    <path d="M 310 220 A 70 70 0 1 0 310 292" fill="none" stroke-width="8" opacity="0.7"/>

    <!-- Coordinate Grid Radial Rays -->
    <line x1="256" y1="256" x2="150" y2="150" stroke-width="5" stroke-dasharray="8 6" opacity="0.6"/>
    <line x1="256" y1="256" x2="150" y2="362" stroke-width="5" stroke-dasharray="8 6" opacity="0.6"/>
  </g>

  <!-- Dynamic Financial Growth & Currency Pulse Trajectory -->
  <g filter="url(#neonFilter)">
    <polyline points="120,350 190,290 230,315 310,215 350,235 410,135" 
              fill="none" stroke="#00E5FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrowhead -->
    <polygon points="410,135 375,142 398,165" fill="#00E5FF"/>

    <!-- Mathematical Calculation & Rate Nodes -->
    <circle cx="120" cy="350" r="14" fill="#10B981"/>
    <circle cx="190" cy="290" r="12" fill="#00D2D3"/>
    <circle cx="230" cy="315" r="12" fill="#00D2D3"/>
    <circle cx="310" cy="215" r="12" fill="#06B6D4"/>
    <circle cx="350" cy="235" r="12" fill="#06B6D4"/>
    <circle cx="410" cy="135" r="16" fill="#FFFFFF"/>
  </g>
</svg>
