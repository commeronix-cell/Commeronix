<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Geometric Grid Accent (Subtle) -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1.5">
    <circle cx="256" cy="256" r="160" fill="none" stroke-dasharray="6 6"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
  </g>

  <!-- Futuristic "C" Emblem & Growth Trajectory -->
  <g filter="url(#neonGlow)">
    <!-- Outer "C" Segment -->
    <path d="M360 160 C325 120, 270 100, 210 115 C145 132, 100 190, 100 256 C100 322, 145 380, 210 397 C270 412, 325 392, 360 352" 
          stroke="url(#brandGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Inner Concentric Arc -->
    <path d="M305 200 C280 170, 240 160, 205 170 C165 182, 145 218, 145 256 C145 294, 165 330, 205 342 C240 352, 280 342, 305 312" 
          stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

    <!-- Dynamic Growth Vector / Calculation Pulse -->
    <path d="M120 310 L200 270 L250 315 L380 145" 
          stroke="#00E5FF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="340,145 380,145 380,185" 
          stroke="#00E5FF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tech Grid Calculation Nodes -->
    <circle cx="120" cy="310" r="12" fill="#00E5FF"/>
    <circle cx="200" cy="270" r="12" fill="#00E5FF"/>
    <circle cx="250" cy="315" r="12" fill="#10B981"/>
    <circle cx="380" cy="145" r="14" fill="#FFFFFF"/>
    <circle cx="210" cy="115" r="9" fill="#00E5FF"/>
    <circle cx="210" cy="397" r="9" fill="#10B981"/>
  </g>
</svg>
