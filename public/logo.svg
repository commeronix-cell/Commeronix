<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" fill="none">
  <defs>
    <!-- Background (Transparent or dark card) -->
    <linearGradient id="logoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(20, 20) scale(0.39)" filter="url(#logoGlow)">
    <!-- Outer "C" Segment -->
    <path d="M360 160 C325 120, 270 100, 210 115 C145 132, 100 190, 100 256 C100 322, 145 380, 210 397 C270 412, 325 392, 360 352" 
          stroke="url(#logoBrandGrad)" stroke-width="32" stroke-linecap="round"/>

    <!-- Inner Concentric Arc -->
    <path d="M305 200 C280 170, 240 160, 205 170 C165 182, 145 218, 145 256 C145 294, 165 330, 205 342 C240 352, 280 342, 305 312" 
          stroke="url(#logoBrandGrad)" stroke-width="16" stroke-linecap="round" opacity="0.85"/>

    <!-- Dynamic Growth Vector / Calculation Pulse -->
    <path d="M120 310 L200 270 L250 315 L380 145" 
          stroke="#00E5FF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="340,145 380,145 380,185" 
          stroke="#00E5FF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tech Grid Calculation Nodes -->
    <circle cx="120" cy="310" r="16" fill="#00E5FF"/>
    <circle cx="200" cy="270" r="16" fill="#00E5FF"/>
    <circle cx="250" cy="315" r="16" fill="#10B981"/>
    <circle cx="380" cy="145" r="18" fill="#FFFFFF"/>
    <circle cx="210" cy="115" r="12" fill="#00E5FF"/>
    <circle cx="210" cy="397" r="12" fill="#10B981"/>
  </g>

  <!-- Typography -->
  <text x="240" y="138" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="78" font-weight="800" letter-spacing="2" fill="url(#textGrad)">
    COMMERO<tspan fill="url(#logoBrandGrad)">NIX</tspan>
  </text>
  <text x="245" y="178" font-family="'Inter', sans-serif" font-size="20" font-weight="600" letter-spacing="7" fill="#94A3B8">
    FINANCIAL &amp; CALCULATION SUITE
  </text>
</svg>
